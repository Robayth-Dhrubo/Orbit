name: Orbit Phase 2 checks

on:
  push:
    branches: [main, cleanup/phase2-submission]
  pull_request:
    paths:
      - apps/api/**
      - database/**
      - openapi.yaml
      - compose.yaml
      - .github/workflows/orbit-booking-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit_test
          POSTGRES_DB: orbit_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify complete Phase 2 service and repeat concurrency race
        env:
          TEST_DATABASE_URL: postgresql://orbit:orbit_test@127.0.0.1:${{ job.services.postgres.ports[5432] }}/orbit_test
        run: npm run test:phase2
